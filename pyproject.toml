[project]
name = "mcp-dpe-fr"
version = "0.1.0"
description = "Read-only MCP server over the French DPE open data (ADEME): aggregated energy-performance statistics, no addresses."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27,<1", "pydantic>=2.5,<3"]
keywords = ["mcp", "dpe", "ademe", "open-data", "france", "energy"]

[project.scripts]
mcp-dpe-fr = "mcp_dpe_fr.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dpe_fr"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals", "scripts"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]
